name: Volume 11 layout diagnostics
on:
  pull_request:
    branches: [main]
concurrency:
  group: volume11-layout-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.head_ref == 'codex/volume11-complete-rewrite'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Package exact-head source for layout reproduction
        run: git archive --format=tar.gz --output=volume11-layout-source.tar.gz HEAD volume11-randomness common tools build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: volume11-layout-source
          path: volume11-layout-source.tar.gz
          retention-days: 3
