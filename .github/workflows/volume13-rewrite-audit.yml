name: Volume 13 complete-rewrite audit
on:
  pull_request:
    paths:
      - 'volume13-arithmetic/**'
      - 'review/volume13-complete-rewrite/**'
      - '.github/workflows/volume13-rewrite-audit.yml'
permissions:
  contents: read
jobs:
  source-numerical-regressions:
    if: github.head_ref == 'codex/volume13-complete-rewrite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Preserve exact original mathematical blocks and artwork
        run: python3 review/volume13-complete-rewrite/check_preservation.py --final
      - name: Recalculate new examples in seventeen chapters
        run: python3 review/volume13-complete-rewrite/check_new_examples.py
      - name: Install numerical dependencies
        run: python3 -m pip install mpmath numpy scipy sympy networkx
      - name: Original seventeen chapter numerical regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find review/volume13-rewrite -maxdepth 1 -name 'check_ch*.py' | wc -l)" -eq 17
          for s in review/volume13-rewrite/check_ch*.py; do python3 "$s"; done
      - name: Check inbound/outbound Volume 13 numbered citations
        run: |
          python3 - <<'PY'
          from tools.cross_volume_citations import VOLUMES, number_volume, collect_citations, mismatches, gloss_mismatches
          books={n:number_volume(n) for n in VOLUMES}
          citations=[c for c in collect_citations() if c.volume==13 or c.source.startswith("volume13-arithmetic/")]
          errors=mismatches(books,citations)+[e for e in gloss_mismatches() if e.startswith("volume13-arithmetic/")]
          print("Checked",len(citations),"Volume 13 citations")
          if errors: raise SystemExit("\n".join(errors))
          PY
      - name: Tools suite and catalogue
        run: |
          python3 -m pip install -r tools/requirements-test.txt
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/listing.py volume13-arithmetic /tmp/volume13-listing.md
