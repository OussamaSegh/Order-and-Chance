name: Build books

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX and pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended pandoc
      - name: Build PDF and EPUB
        run: ./build.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the notebooks
        run: |
          pip install -r requirements.txt
          for nb in python/*/*.ipynb; do
            jupyter nbconvert --to notebook --execute "$nb" --output-dir build/notebooks
          done
      - uses: actions/upload-artifact@v4
        with:
          name: books
          path: dist/
