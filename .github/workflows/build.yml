name: Build books

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Several writing threads push to main; let a running build finish and publish.
  # GitHub keeps at most one pending run per group, so the newest commit is built next.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One build job per tome, run in parallel: a serial build of every tome takes too long once
  # several threads push to main, and a pending run is replaced by the next push.
  list:
    runs-on: ubuntu-24.04
    outputs:
      tomes: ${{ steps.ls.outputs.tomes }}
      notebooks: ${{ steps.ls.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: |
          echo "tomes=$(ls -d tome*/ | tr -d / | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "notebooks=$(ls -d python/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tome: ${{ fromJson(needs.list.outputs.tomes) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX, pandoc and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended tex-gyre texlive-pictures pandoc poppler-utils
      - name: Build PDF and EPUB
        run: ./build.sh ${{ matrix.tome }}
      - uses: actions/upload-artifact@v4
        with:
          name: books-${{ matrix.tome }}
          path: dist/

  # Gathers the books of every tome and builds the download page.
  site:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: books-*
          merge-multiple: true
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: books
          path: dist/
      - name: Build the download page
        run: python3 tools/site.py dist build/site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/site

  # The companion notebooks are checked separately, one job per folder, so that a slow or
  # failing notebook never holds back the books.
  notebooks:
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.list.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the notebooks
        run: |
          pip install -r requirements.txt
          for nb in python/${{ matrix.folder }}/*.ipynb; do
            echo "== $nb"
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 "$nb" --output-dir build/notebooks
          done

  # On main, publish the books for visitors: a GitHub Pages download page and a rolling release.
  publish:
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: books
          path: dist
      - name: Update the "books" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete books --yes --cleanup-tag || true
          gh release create books dist/*.pdf dist/*.epub dist/kdp/* --target "$GITHUB_SHA" --latest \
            --title "Books (latest build)" \
            --notes "PDF and EPUB of every tome, rebuilt automatically from commit ${GITHUB_SHA::7}. Files named *-print.pdf, *-cover-wrap.pdf and *-ebook-cover.jpg are the Amazon KDP paperback interior, paperback cover and Kindle cover."
      # Needs Settings > Pages > Source set to "GitHub Actions"; until then the release above still works.
      - name: Deploy the download page
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
