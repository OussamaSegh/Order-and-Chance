name: Build books

on:
  # Branches are built through their pull request only: a push to a PR branch used to start two runs,
  # and GitHub's free plan runs at most 20 jobs at a time across the repository.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild every book, ignoring cached outputs
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  # Several writing threads push to main; let a running build finish and publish.
  # GitHub keeps at most one pending run per group, so the newest commit is built next.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Compare all publishing inputs against the exact restored library snapshot.
  list:
    runs-on: ubuntu-24.04
    outputs:
      tomes: ${{ steps.plan.outputs.tomes }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      snapshot_changed: ${{ steps.plan.outputs.snapshot_changed }}
      baseline: ${{ steps.library.outputs.cache-matched-key }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF publishing helpers
        run: python3 -m pip install -r tools/requirements-build.txt
      - name: Test publishing configuration and build selection
        run: |
          python3 tools/print_layout.py --check
          python3 -m unittest discover -s tools -p 'test_*.py'
      - uses: actions/cache/restore@v4
        id: library
        with:
          path: .book-cache
          key: library-v7-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: library-v7-
      - id: plan
        env:
          FORCE_ALL: ${{ inputs.rebuild_all || false }}
        run: |
          args=()
          if [ "$FORCE_ALL" = true ]; then args+=(--force); fi
          python3 tools/build_plan.py plan "${args[@]}"
          echo "tomes=$(jq -c .changed build-plan.json)" >> "$GITHUB_OUTPUT"
          echo "has_changes=$(jq '.changed | length > 0' build-plan.json)" >> "$GITHUB_OUTPUT"
          echo "snapshot_changed=$(jq '(.changed | length) + (.removed | length) > 0' build-plan.json)" >> "$GITHUB_OUTPUT"
          jq '{rebuilt: .changed, removed: .removed}' build-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: build-plan.json

  # The Ubuntu mirror is sometimes very slow, and a dozen parallel jobs downloading 120 MB each make it worse.
  # One job downloads the TeX packages once and caches the .deb files; every build job installs from the cache.
  debs:
    needs: list
    if: needs.list.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: debs
          key: tex-debs-ubuntu-24.04-v3-xetex-gs
      - name: Download the packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            sudo timeout 300 apt-get -o Acquire::Retries=5 update &&
            sudo timeout 1500 apt-get -o Acquire::Retries=5 install -y --download-only --no-install-recommends \
              texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended tex-gyre \
              texlive-pictures texlive-xetex python3-pil pandoc poppler-utils ghostscript && break
            echo "apt attempt $i failed, retrying"; sleep 10
          done
          mkdir -p debs && cp /var/cache/apt/archives/*.deb debs/ && ls debs | wc -l

  build:
    needs: [list, debs]
    if: needs.list.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tome: ${{ fromJson(needs.list.outputs.tomes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: debs
          key: tex-debs-ubuntu-24.04-v3-xetex-gs
          fail-on-cache-miss: true
      - name: Install LaTeX, Ghostscript, pandoc and poppler
        run: |
          sudo dpkg -i debs/*.deb > /dev/null
          rm -rf debs
          command -v xelatex && command -v gs && command -v pandoc && command -v pdftoppm
      - name: Install PDF publishing helpers
        run: python3 -m pip install -r tools/requirements-build.txt
      - name: Test whole-box pagination and reference placement
        run: python3 -m unittest discover -s tools -p test_book_layout.py
      - name: Test the KDP print export
        run: |
          python3 -m unittest discover -s tools -p test_kdp_pdf.py
          python3 -m unittest discover -s tools -p test_kdp_cover.py
      - name: Build 7 x 10 reading PDF with cover, print PDF, EPUB and publishing assets
        run: ./build.sh ${{ matrix.tome }}
      - uses: actions/upload-artifact@v4
        with:
          name: books-${{ matrix.tome }}
          # dist/ holds the reading PDF, EPUB and dist/kdp/ print PDF/assets; the cover page is for the site's thumbnails.
          path: |
            dist/
            build/${{ matrix.tome }}/cover.pdf
            build/${{ matrix.tome }}/cover-preflight.json
            build/${{ matrix.tome }}/kdp-preflight.json

  # Gathers the books of every tome and builds the download page.
  site:
    needs: [list, build]
    if: ${{ always() && needs.list.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.list.outputs.has_changes == 'false')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF publishing helpers
        run: python3 -m pip install -r tools/requirements-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: build-plan
      - uses: actions/cache/restore@v4
        if: needs.list.outputs.baseline != ''
        with:
          path: .book-cache
          key: ${{ needs.list.outputs.baseline }}
          fail-on-cache-miss: true
      - name: Restore unchanged books and clear replaced outputs
        run: python3 tools/build_plan.py prepare
      - uses: actions/download-artifact@v4
        if: needs.list.outputs.has_changes == 'true'
        with:
          pattern: books-*
          merge-multiple: true
          path: .
      - name: Install poppler
        run: sudo timeout 300 apt-get update && sudo timeout 300 apt-get install -y --no-install-recommends poppler-utils
      - name: Test the download page generator
        run: python3 -m unittest discover -s tools -p test_site.py
      - name: Build the download page
        run: python3 tools/site.py dist build/site
      - name: Validate and snapshot the complete library
        run: python3 tools/build_plan.py snapshot
      - uses: actions/upload-artifact@v4
        if: needs.list.outputs.snapshot_changed == 'true'
        with:
          name: books
          path: dist/
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.list.outputs.snapshot_changed == 'true'
        with:
          path: .book-cache
          key: library-v7-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/site

  # On main, publish the books for visitors: a GitHub Pages download page and a rolling release.
  publish:
    needs: [list, site]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        if: needs.list.outputs.snapshot_changed == 'true'
        with:
          name: books
          path: dist
      - name: Update the "books" release
        if: needs.list.outputs.snapshot_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete books --yes --cleanup-tag || true
          gh release create books dist/*.pdf dist/*.epub dist/kdp/* --target "$GITHUB_SHA" --latest \
            --title "Books (latest build)" \
            --notes "Complete PDF and EPUB library, updated automatically at commit ${GITHUB_SHA::7}. Each volume has a 7 x 10 in reading PDF with front cover, a separate *-print.pdf paperback interior without that cover, and one EPUB. Files named *-cover-wrap.pdf and *-ebook-cover.jpg are separate paperback and eBook covers."
      # Needs Settings > Pages > Source set to "GitHub Actions"; until then the release above still works.
      - name: Deploy the download page
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
