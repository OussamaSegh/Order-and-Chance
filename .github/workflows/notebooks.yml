name: Test notebooks on demand

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      notebooks: ${{ steps.ls.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: echo "notebooks=$(ls -d python/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  notebooks:
    needs: list
    runs-on: ubuntu-24.04
    # The slowest folder (python/tome14, the workshop notebooks) needs about 40 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.list.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the notebooks
        run: |
          pip install -r requirements.txt
          for nb in python/${{ matrix.folder }}/*.ipynb; do
            echo "== $nb"
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 "$nb" --output-dir build/notebooks
          done
